# ~/.config/hypr/hyprlock/config

general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    no_fade_in = false
}

background {
    path =  ~/Pictures/wallpaper/windows.png
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2            
    inner_color = rgba(00000099)   
    font_color = rgba(c0caf5ff)
    outer_color = rgba(c0caf5ff)
    color_wrong = rgba(ee2e24ff)      

    # show-failed-attempts
    fail_color = rgba(ee2e24ff)
    fail_text = <i>$ATTEMPTS</i>

    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    rounding = 200
    position = 0, -250
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_family = Maple Mono NF                      
    font_size = 80                                 
    color = rgba(c0caf5ff)
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000099)
    position = 0, 320
    halign = center
    valign = center
}


label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    font_family = Maple Mono NF
    font_size = 24
    color = rgba(c0caf5ff)
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000099)
    position = 0, 240
    halign = center
    valign = center
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(c0caf5ff)
    font_size = 16
    font_family = Maple Mono NF
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000099)
    position = -30, -30
    halign = right
    valign = top
}

label { # User
    monitor =
    text = cmd[update:0] ~/.config/hypr/scripts/greeting.sh
    color = rgba(c0caf5ff)
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 24
    font_family = Maple Mono NF
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000099)
    position = 0, 150
    halign = center
    valign = bottom
}

label { # Caps Lock
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = rgba(c0caf5ff)
    font_size = 24
    font_family = Maple Mono NF
    position = 0, -25
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(00000099)
}
