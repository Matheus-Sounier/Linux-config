# ~/.config/hypr/configs/key_exec.conf

# SwayNC
bind = $mod, z, exec, swaync-client -t -sw

# Launcher
bind = $mod, d, exec, pkill wofi || wofi --show drun

# Kill, reload, exit
bind = $mod, F4, killactive
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, W, exec, pkill waybar; waybar

# Bloqueio de tela
bind = $mod, l, exec, hyprlock
bind = $mod, e, exit

# Aplicações principais
bind = $mod, Return, exec, $term
bind = $mod, c, exec, code --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mod, b, exec, google-chrome --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mod, o, exec, dolphin &>/dev/null &
bind = $mod, s, exec, steam &>/dev/null &
bind = $mod, v, exec, virt-manager &>/dev/null &
bind = $mod, i, exec, dbeaver &>/dev/null &

# Screenshot para clipboard apenas
bind = , Print, exec, grim - | wl-copy && notify-send "Screenshot" "Copiado para clipboard"

# Screenshot e salvar
bind = SHIFT, Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "Salvo em ~/Pictures"

# Seleção de área para clipboard
bind = $mod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Área copiada"

# Seleção de área e salvar
bind = $mod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-area-$(date +%Y%m%d-%H%M%S).png && notify-send "Screenshot" "Área salva"

# Volume
bind = $mod, F8, exec, pamixer -i 5 --allow-boost && notify-send "Volume" "$(pamixer --get-volume)%"
bind = $mod, F7, exec, pamixer -d 5 --allow-boost && notify-send "Volume" "$(pamixer --get-volume)%"
bind = $mod, F6, exec, pamixer --toggle-mute && notify-send "Volume" "$(pamixer --get-mute && echo 'Mutado' || echo 'Ativo')"

# Brilho
bind = $mod, F3, exec, brightnessctl set +5% && notify-send "Brilho" "$(brightnessctl get -P)%"
bind = $mod, F2, exec, brightnessctl set 5%- && notify-send "Brilho" "$(brightnessctl get -P)%"

# Teclas de mídia
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 --allow-boost
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 --allow-boost
bind = , XF86AudioMute, exec, pamixer --toggle-mute
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# MODO RESIZE
bind = $mod, r, submap, resize

submap = resize
# Redimensionar com vim keys
binde = , h, resizeactive, -10 0
binde = , j, resizeactive, 0 10
binde = , k, resizeactive, 0 -10
binde = , l, resizeactive, 10 0

# Redimensionar com setas
binde = , Left,  resizeactive, -10 0
binde = , Down,  resizeactive, 0 10
binde = , Up,    resizeactive, 0 -10
binde = , Right, resizeactive, 10 0

# Sair do modo resize
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, r,  submap, reset
submap = reset
