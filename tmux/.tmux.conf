unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a

set -g mouse on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position bottom
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g @plugin 'egel/tmux-gruvbox'

# List of plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Persist and auto-restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Tokyonight-night
set -g mode-style "fg=#c0caf5,bg=#1a1b26"

set -g message-style "fg=#c0caf5,bg=#1a1b26"
set -g message-command-style "fg=#c0caf5,bg=#1a1b26"

set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status on
set -g status-interval 5
set -g status-justify left

set -g status-style "fg=#c0caf5,bg=#1a1b26"

set -g status-left-length 100
set -g status-right-length 100

set -g status-left-style none
set -g status-right-style none

set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26,nobold] #[fg=#c0caf5,bg=#1a1b26]#I.#P #[fg=#7aa2f7,bg=#1a1b26]│ #[fg=#c0caf5,bg=#1a1b26,bold]#{b:pane_current_path} "

set -g status-right "#[fg=#7aa2f7,bg=#1a1b26]#[fg=#1a1b26,bg=#7aa2f7,bold] %Y-%m-%d %H:%M "

setw -g window-status-activity-style "underscore,fg=#7aa2f7,bg=#1a1b26"
setw -g window-status-separator ""

setw -g window-status-style "fg=#565f89,bg=#1a1b26"

setw -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I #[fg=#7aa2f7]│#[fg=#c0caf5] #{?#{==:#{b:pane_current_command},vim},vim,#{?#{==:#{b:pane_current_command},nvim},Neovim,#{?#{==:#{b:pane_current_command},opencode},OpenCode,#{?#{m:#{b:pane_current_command},(zsh|bash|fish)},Shell,#{b:pane_current_command}}}}} "

setw -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7,bold] #I #[fg=#7aa2f7,bg=#1a1b26]#[fg=#c0caf5,bg=#1a1b26,bold] #{?#{==:#{b:pane_current_command},vim},vim,#{?#{==:#{b:pane_current_command},nvim},Neovim,#{?#{==:#{b:pane_current_command},opencode},OpenCode,#{?#{m:#{b:pane_current_command},(zsh|bash|fish)},Shell,#{b:pane_current_command}}}}} "
